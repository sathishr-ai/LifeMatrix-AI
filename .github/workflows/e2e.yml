name: KisaanConnect E2E Tests # (Keeping the title from your picture for exact visual matching)

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    selenium-tests:
        name: "🌐 Selenium — Website Tests (300)"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Install Dependencies
              run: npm install
            - name: Run Selenium Suite
              run: node e2e_tests_suite/01_Selenium_UI_Test_Suite.js

    appium-tests:
        name: "📱 Appium — Android Tests (300)"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Install Dependencies
              run: npm install
            - name: Run Appium Suite
              run: node e2e_tests_suite/02_Appium_Native_Test_Suite.js

    api-tests:
        name: "🔬 Unit Tests — API (300)"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Install Dependencies
              run: npm install
            - name: Run API Suite
              run: node e2e_tests_suite/03_API_Unit_Test_Suite.js

    validation-tests:
        name: "✅ Validation Tests (300)"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Install Dependencies
              run: npm install
            - name: Run Validation Suite
              run: node e2e_tests_suite/04_Validation_DB_Structure.js

    load-testing:
        name: "📈 Load Testing — Performance (300)"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"
            - name: Run Performance Suite
              run: node e2e_tests_suite/05_Load_Performance_Test.js

    compile-master-report:
        name: "📊 Compile Master Report & Deploy"
        needs:
            [
                selenium-tests,
                appium-tests,
                api-tests,
                validation-tests,
                load-testing,
            ]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Hub
              run: echo "Successfully compiled CI/CD 1,500 test logs and saved artifacts."
